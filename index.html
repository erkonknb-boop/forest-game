<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хватай!</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#3d4149,#101216 78%);font-family:Georgia,serif;color:#fff;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.hud{position:fixed;z-index:5;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 4px #000}
#w{top:calc(env(safe-area-inset-top,0px) + 12px);font-size:34px;font-weight:700}
#sc img{height:40px;vertical-align:middle}
#sc{top:calc(env(safe-area-inset-top,0px) + 62px);font-size:22px}
#rd{top:calc(env(safe-area-inset-top,0px) + 112px);font-size:16px;opacity:.85}
#inf{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:18px}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,14,20,.78);text-align:center;padding:20px}
.ov h1{margin:0;font-size:32px}.ov p{margin:0;font-size:18px;max-width:320px}
button{font:inherit;font-weight:700;font-size:22px;padding:14px 32px;border-radius:16px;border:0;background:#e8b13a;color:#241a05}
#rs{position:fixed;z-index:6;left:10px;top:calc(env(safe-area-inset-top,0px) + 140px);padding:8px 14px;font-size:20px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hide{display:none!important}

#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 25%,#3d4149,#101216 78%);padding:20px;box-sizing:border-box;overflow:auto}
#menu h1{margin:0;font-size:36px;text-shadow:0 2px 6px #000}
#menu .sub{margin:0;font-size:17px;opacity:.8}
.games{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.gc{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;padding:16px 18px;border-radius:18px;border:2px solid #e8b13a;background:rgba(255,255,255,.07);color:#fff;text-align:left;font-size:20px;cursor:pointer}
.gc:active{transform:scale(.98)}
.gc .num{flex:none;width:44px;height:44px;border-radius:50%;background:#e8b13a;color:#241a05;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.gc .ti{display:block;font-weight:700}
.gc .de{display:block;font-size:14px;opacity:.75;font-weight:400;margin-top:2px}
.gc.soon{border-color:#555;opacity:.5;cursor:default}
.gc.soon .num{background:#555;color:#ccc}
#bk{position:fixed;z-index:6;left:10px;top:calc(env(safe-area-inset-top,0px) + 190px);padding:8px 14px;font-size:20px}

#mj{position:fixed;inset:0;z-index:30;background:#3a3a3c;color:#fff;font-family:-apple-system,Arial,sans-serif;text-align:center;overflow:auto;user-select:none;-webkit-tap-highlight-color:transparent}
#mj *{box-sizing:border-box}
#mj .mj-wrap{max-width:430px;margin:0 auto;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 20px)}
#mj h1{margin:calc(env(safe-area-inset-top,0px) + 24px) 0 6px;font-size:28px;font-family:inherit}
#mj .mj-sub{color:#bbb;margin-bottom:20px}
#mj .mj-lvl{display:block;width:100%;margin:12px 0;padding:18px;font-size:20px;font-weight:bold;border:0;border-radius:16px;color:#fff;background:#d9798f;box-shadow:0 6px 0 #a8566a;font-family:inherit}
#mj .mj-lvl:active{transform:translateY(4px);box-shadow:0 2px 0 #a8566a}
#mj .mj-lvl small{display:block;font-size:13px;font-weight:normal;opacity:.85;margin-top:4px}
#mj #mj-top{display:flex;justify-content:space-around;padding:calc(env(safe-area-inset-top,0px) + 14px) 8px 6px;font-size:17px;font-weight:bold}
#mj #mj-board{display:grid;gap:9px;margin:12px auto}
#mj .mj-tile{position:relative;aspect-ratio:1;border-radius:14px;background:#dc7f94;box-shadow:0 7px 0 #f2e9e4,0 9px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,background .15s;padding:3px}
#mj .mj-tile:active{transform:translateY(3px)}
#mj .mj-tile svg{width:100%;height:100%;display:block}
#mj .mj-tile.sel{background:#2f5fd0;box-shadow:0 7px 0 #1c3a85,0 9px 6px rgba(0,0,0,.45)}
#mj .mj-tile.open{background:#fff;box-shadow:0 7px 0 #cfc6c0,0 9px 6px rgba(0,0,0,.45);animation:mjpop .2s}
#mj .mj-tile.done{background:#fff;opacity:.35;box-shadow:0 3px 0 #cfc6c0;pointer-events:none;transform:scale(.92)}
#mj .mj-tile.shake{animation:mjshake .35s}
@keyframes mjpop{0%{transform:scale(.85)}100%{transform:scale(1)}}
@keyframes mjshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#mj .mj-row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#mj .mj-btn{padding:12px 20px;font-size:16px;border:0;border-radius:12px;background:#4a7bd6;color:#fff;font-weight:bold;box-shadow:0 4px 0 #2d4f94;font-family:inherit}
#mj .mj-btn.gray{background:#6b6b6e;box-shadow:0 4px 0 #444}
#mj #mj-win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;z-index:2}
#mj #mj-win .mj-box{background:#fff;color:#222;border-radius:22px;padding:28px 26px;width:84%;max-width:340px}
#mj #mj-win h2{margin:0 0 10px;font-size:26px}
#mj #mj-win p{margin:6px 0;font-size:17px}
#mj #mj-hint{color:#bbb;font-size:14px;margin-top:8px;min-height:18px}
</style></head><body>
<div id="w" class="hud">&nbsp;</div><div id="sc" class="hud">Ты 0 : 0 Альпин</div><div id="rd" class="hud">Раунд 1 из 3</div><div id="inf" class="hud">&nbsp;</div>
<button id="rs" aria-label="Заново">↻</button>
<div id="menu"><h1>Игры</h1><p class="sub">Выбери игру</p><div class="games">
<button class="gc" id="g1"><span class="num">1</span><span><span class="ti">Хватай!</span><span class="de">Кто быстрее схватит предмет</span></span></button>
<button class="gc" id="g2"><span class="num">2</span><span><span class="ti">Маджонг-мемори</span><span class="de">Найди пары картинок</span></span></button>
<button class="gc soon" id="g3" disabled><span class="num">3</span><span><span class="ti">Третья игра</span><span class="de">Скоро</span></span></button>
</div></div>
<button id="bk" class="hide" aria-label="В меню">☰</button>
<div id="st" class="ov hide"><h1>Хватай!</h1><p>На экране появится название предмета. Тапни его на столе раньше соперника, и он твой. Всего 10 предметов.</p><button id="go">Начать игру</button></div>
<div id="en" class="ov hide"><h1 id="et"></h1><p id="es"></p><button id="ag">Играть ещё</button></div>
<div id="mj" class="hide"><div class="mj-wrap">
<div id="mj-menu">
<h1>🀄 Маджонг Мемори</h1>
<div class="mj-sub">Найди все пары картинок под розовыми плитками</div>
<button class="mj-lvl" data-lv="0">Лёгкий<small>4 × 3 · 6 пар · без ограничений</small></button>
<button class="mj-lvl" data-lv="1">Средний<small>4 × 4 · 8 пар · 60 секунд</small></button>
<button class="mj-lvl" data-lv="2">Сложный<small>5 × 6 · 15 пар · 120 секунд</small></button>
<button class="mj-lvl" data-lv="3">Эксперт<small>6 × 6 · 18 пар · 150 секунд · 20 ошибок</small></button>
<div id="mj-records" class="mj-sub" style="margin-top:20px"></div>
<button class="mj-btn gray" id="mj-home">☰ В меню игр</button>
</div>
<div id="mj-game" style="display:none">
<div id="mj-top"><span id="mj-tTime">⏱ 0:00</span><span id="mj-tMoves">Ходы: 0</span><span id="mj-tPairs">Пары: 0/0</span></div>
<div id="mj-board"></div>
<div id="mj-hint"></div>
<div class="mj-row">
<button class="mj-btn" id="mj-hintBtn">💡 Подсказка (<span id="mj-hintsLeft">3</span>)</button>
<button class="mj-btn gray" id="mj-again">Заново</button>
<button class="mj-btn gray" id="mj-tomenu">Уровни</button>
</div>
</div>
<div id="mj-win"><div class="mj-box">
<h2 id="mj-winTitle"></h2><p id="mj-winText"></p>
<div class="mj-row"><button class="mj-btn" id="mj-again2">Ещё раз</button><button class="mj-btn gray" id="mj-tomenu2">Уровни</button></div>
</div></div>
</div></div>

 board.style.gridTemplateColumns='repeat('+L.cols+',1fr)';
 const picks=shuffle(CHARS.slice()).slice(0,total);
 const deck=shuffle(picks.flatMap(c=>[c,c]));
 deck.forEach(c=>{
  const t=document.createElement('div');
  t.className='mj-tile';
  t.dataset.pic=c.n;
  t.dataset.svg=face(c);
  t.onclick=()=>flip(t);
  board.appendChild(t);
 });
 update();
 clearInterval(timer);
 timer=setInterval(tick,1000);
}
function show(t){t.innerHTML=t.dataset.svg;}
function hide(t){t.innerHTML='';}
function tick(){
 const L=LEVELS[lv];
 if(L.time){seconds--;if(seconds<=0){seconds=0;update();end(false,'Время вышло!');return;}}
 else seconds++;
 update();
}
function update(){
 const L=LEVELS[lv];
 g('mj-tTime').textContent='⏱ '+fmt(seconds);
 g('mj-tMoves').textContent='Ходы: '+moves+(L.errors?' · Ошибки: '+errors+'/'+L.errors:'');
 g('mj-tPairs').textContent='Пары: '+pairs+'/'+total;
}
function flip(t){
 if(lock||t.classList.contains('open')||t.classList.contains('done'))return;
 t.classList.add('open');show(t);sel.push(t);
 if(sel.length<2)return;
 moves++;
 const a=sel[0],b=sel[1];
 if(a.dataset.pic===b.dataset.pic){
  setTimeout(()=>{
   a.classList.remove('open');b.classList.remove('open');
   a.classList.add('done');b.classList.add('done');
   sel=[];pairs++;update();
   if(pairs===total)end(true);
  },350);
 }else{
  errors++;lock=true;
  a.classList.add('shake');b.classList.add('shake');
  setTimeout(()=>{
   [a,b].forEach(x=>{x.classList.remove('open','shake');hide(x);});
   sel=[];lock=false;update();
   const L=LEVELS[lv];
   if(L.errors&&errors>=L.errors)end(false,'Слишком много ошибок!');
  },800);
 }
 update();
}
function useHint(){
 if(hintsLeft<=0||lock)return;
 const tiles=[...document.querySelectorAll('#mj .mj-tile')].filter(t=>!t.classList.contains('done')&&!t.classList.contains('open'));
 if(tiles.length<2)return;
 const first=tiles[Math.floor(Math.random()*tiles.length)];
 const mate=tiles.find(t=>t!==first&&t.dataset.pic===first.dataset.pic);
 if(!mate)return;
 hintsLeft--;
 g('mj-hintsLeft').textContent=hintsLeft;
 lock=true;
 [first,mate].forEach(t=>t.classList.add('sel'));
 g('mj-hint').textContent='Запомни синие плитки!';
 setTimeout(()=>{
  [first,mate].forEach(t=>{t.classList.remove('sel');t.classList.add('open');show(t);});
  setTimeout(()=>{
   [first,mate].forEach(t=>{t.classList.remove('open');hide(t);});
   g('mj-hint').textContent='';
   lock=false;
  },900);
 },600);
}
function end(won,reason){
 clearInterval(timer);lock=true;
 const L=LEVELS[lv];
 const spent=L.time?L.time-seconds:seconds;
 let title,text;
 if(won){
  title='🎉 Победа!';
  text='Ходов: '+moves+'<br>Время: '+fmt(spent);
  const r=getRec();
  if(!r[lv]||moves<r[lv].moves||(moves===r[lv].moves&&spent<r[lv].time)){
   r[lv]={moves:moves,time:spent};setRec(r);
   text+='<br>🏆 Новый рекорд!';
  }
 }else{
  title='😢 Не получилось';
  text=reason+'<br>Найдено пар: '+pairs+' из '+total;
 }
 g('mj-winTitle').textContent=title;
 g('mj-winText').innerHTML=text;
 g('mj-win').style.display='flex';
}
function levels(){
 clearInterval(timer);
 g('mj-win').style.display='none';
 g('mj-game').style.display='none';
 g('mj-menu').style.display='block';
 showRecords();
}
// ---- Вход и выход из игры (связка с главным меню сайта) ----
window.openMahjong=function(){
 document.getElementById('menu').classList.add('hide');
 g('mj').classList.remove('hide');
 levels();
};
function closeMahjong(){
 clearInterval(timer);lock=true;
 g('mj').classList.add('hide');
 document.getElementById('menu').classList.remove('hide');
}
document.querySelectorAll('#mj .mj-lvl').forEach(b=>b.onclick=()=>startGame(+b.dataset.lv));
g('mj-hintBtn').onclick=useHint;
g('mj-again').onclick=()=>startGame(lv);
g('mj-again2').onclick=()=>startGame(lv);
g('mj-tomenu').onclick=levels;
g('mj-tomenu2').onclick=levels;
g('mj-home').onclick=closeMahjong;
document.getElementById('g2').onclick=window.openMahjong;
})();
</script>
</body></html>
