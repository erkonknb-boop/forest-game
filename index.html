<title>Вид номер Казахстана</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
.iphone{width:390px;height:844px;max-width:100vw;max-height:100vh;position:relative;background:#050a1e;border-radius:54px;overflow:hidden;border:8px solid #111;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.wallpaper{position:absolute;inset:0;z-index:1;background:#050a1e;background-image:radial-gradient(40% 30% at 20% 15%,rgba(60,90,150,.5) 0%,transparent 60%),radial-gradient(50% 40% at 80% 20%,rgba(80,110,180,.4) 0%,transparent 60%),radial-gradient(60% 50% at 50% 50%,rgba(30,50,100,.6) 0%,transparent 70%),radial-gradient(70% 60% at 30% 80%,rgba(20,40,90,.5) 0%,transparent 60%),linear-gradient(180deg,#0a1430 0%,#050a1e 100%)}
.status{position:relative;z-index:10;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;color:#fff;font-size:15px;font-weight:600}
.home{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;padding-top:120px}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}.app:active{transform:scale(.93)}
.icon{width:76px;height:76px;border-radius:17px;background:linear-gradient(135deg,#2a5db0,#1a2e7a);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);font-size:28px}
.label{color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9);text-align:center;line-height:1.2;max-width:120px}
.indicator{position:relative;z-index:10;height:20px;display:flex;justify-content:center;align-items:center;padding-bottom:6px}.indicator div{width:134px;height:5px;background:#fff;border-radius:3px}
.window{position:absolute;inset:0;background:#f4f6f9;z-index:20;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;border-radius:54px}.window.open{transform:translateY(0);border-radius:0}
.bar{height:52px;background:#fff;border-bottom:1px solid #e5e8eb;display:flex;align-items:center;padding:0 16px;gap:12px}.close{width:28px;height:28px;background:#111;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:14px;cursor:pointer}.frame{flex:1;border:none;width:100%}
</style>
</head>
<body>
<div class="iphone">
  <div class="wallpaper"></div>
  <div class="status"><div>16:27</div><div>LTE ●○</div></div>
  <div class="home">
    <div class="app" onclick="openApp()">
      <div class="icon">KZ</div>
      <div class="label">Вид номер Казахстана</div>
    </div>
  </div>
  <div class="indicator"><div></div></div>
  <div class="window" id="win">
    <div class="bar"><div class="close" onclick="closeApp()">✕</div><div style="font-weight:700">Вид номер Казахстана</div></div>
    <iframe class="frame" id="frame"></iframe>
  </div>
</div>
