ems:center;border:2px solid #cbd5e1;border-radius:10px;background:#fff;overflow:hidden;height:50px;box-shadow:0 2px 8px rgba(0,0,0,.06);max-width:95%}.plate-kz{width:46px;height:100%;background:#f8fafc;border-right:2px solid #cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;line-height:1}.plate-kz i{font-style:normal;font-size:12px}.plate-main{padding:0 10px;display:flex;gap:4px;align-items:center}.plate-main input{border:none;padding:0;margin:0;width:90px;font-size:22px;font-weight:800;letter-spacing:1px;text-align:center;background:transparent}.plate-reg{border-left:2px solid #cbd5e1;height:100%;display:flex;align-items:center;padding:0 10px}.plate-reg input{border:none;padding:0;margin:0;width:34px;font-size:20px;font-weight:800;text-align:center;background:transparent}.plate-hint{font-size:10px;color:#888;text-align:center;margin-top:6px}.result-box{background:#f8fafc;border-radius:10px;padding:12px;margin-top:12px;border:1px solid #eef1f4}.result-box .free{color:#16a34a;font-weight:700;font-size:12px}.result-box .price{font-size:20px;font-weight:900;margin-top:4px}.name-result{border:1px dashed #2a5db0;background:#f0f5ff;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}</style></head><body>

<script>
const MRP=4325;const CAT_010=["010","020","030","040","050","060","070","077","080","090","707"];const CAT_100=["100","111","200","222","300","333","400","444","500","555","600","666","700","800","888","900","999"];const CAT_001=["001","002","003","004","005","006","007","008","009","777"];const CAT_MIRROR=["101","121","131","141","151","161","171","181","191","202","212","232","242","252","262","272","282","292","303","313","323","343","353","363","373","383","393","404","414","424","434","454","464","474","484","494","505","515","525","535","545","565","575","585","595","606","616","626","636","646","656","676","686","696","717","727","737","747","757","767","787","797","808","818","828","838","848","858","868","878","898","909","919","929","939","949","959","969","979","989"];let currentFilter='all';const filters=[{id:'all',label:'Все'},{id:'10',label:'10 МРП'},{id:'15',label:'15 МРП'},{id:'57',label:'57 МРП'},{id:'72',label:'72 МРП'},{id:'114',label:'114 МРП'},{id:'137',label:'137 МРП'},{id:'194',label:'194 МРП'},{id:'228',label:'228 МРП'},{id:'285',label:'285 МРП'}];function initFilters(){const bar=document.getElementById('filterBar');bar.innerHTML=filters.map(f=>`<div class="chip ${f.id==='all'?'active':''}" onclick="setFilter('${f.id}',this)">${f.label}</div>`).join('');}function setFilter(f,el){currentFilter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render();}function getCategory(num,same){if(CAT_001.includes(num))return same?{mrp:285}:{mrp:228};if(CAT_100.includes(num))return same?{mrp:194}:{mrp:137};if(CAT_010.includes(num))return same?{mrp:114}:{mrp:57};if(CAT_MIRROR.includes(num))return same?{mrp:72}:{mrp:15};if(same)return{mrp:57};return{mrp:10};}function updateResult(){let d=(document.getElementById('digits').value||'').replace(/\D/g,'').slice(0,3).padStart(3,'0');let l=(document.getElementById('letters').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3).padEnd(3,'A');let r=(document.getElementById('region').value||'').replace(/\D/g,'').slice(0,2).padStart(2,'0');const same=l[0]===l[1]&&l[1]===l[2];const cat=getCategory(d,same);const price=cat.mrp*MRP;document.getElementById('resultCat').innerText=`Стоимость составляет ${cat.mrp} МРП`;document.getElementById('resultPrice').innerText=`${price.toLocaleString('ru-RU')} тенге`;}function render(){let d=(document.getElementById('digits').value||'').replace(/\D/g,'').slice(0,3);let l=(document.getElementById('letters').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);let r=(document.getElementById('region').value||'').replace(/\D/g,'').slice(0,2);document.getElementById('digits').value=d;document.getElementById('letters').value=l;document.getElementById('region').value=r;if(d.length!==3||l.length!==3||r.length!==2){updateResult();return;}const region=r;const grid=document.getElementById('grid');grid.innerHTML='';let baseNums=[...CAT_001,...CAT_100,...CAT_010,...CAT_MIRROR,"707","777","010","101","202","303","404","505","606","808","909","123","321"];baseNums=[...new Set(baseNums)];if(d)baseNums=baseNums.filter(n=>n.includes(d));if(baseNums.length===0)baseNums=[d];let list=[];baseNums.forEach(n=>{const variants=[{letters:l,same:l[0]===l[1]&&l[1]===l[2]}];variants.forEach(v=>{const cat=getCategory(n,v.same);if(currentFilter!=='all'&&String(cat.mrp)!==currentFilter)return;list.push({num:n,letters:v.letters,same:v.same,cat});});});list.sort((a,b)=>b.cat.mrp-a.cat.mrp);const seen=new Set();list=list.filter(i=>{const k=i.num+i.letters;if(seen.has(k))return false;seen.add(k);return true;});list.forEach(item=>{const price=item.cat.mrp*MRP;const div=document.createElement('div');div.className='num-card';div.innerHTML=`<b>${item.num} ${item.letters}</b><span>${region}</span><div class="price-tag">${price.toLocaleString('ru-RU')} ₸</div><span>${item.cat.mrp} МРП</span>`;div.onclick=()=>{document.getElementById('digits').value=item.num;document.getElementById('letters').value=item.letters;updateResult();window.scrollTo({top:0,behavior:'smooth'})};grid.appendChild(div);});updateResult();}function findByName(){let raw=(document.getElementById('nameInput').value||'').toUpperCase().trim().replace(/[^A-Z]/g,'').slice(0,12);document.getElementById('nameInput').value=raw;if(!raw||raw.length<2){alert('Напиши имя на английском, например DIAS');return;}const mapNum={'A':'4','O':'0','S':'5','E':'3','I':'1','Z':'2','B':'8','D':'0','L':'1','G':'6','Q':'9'};let nums='';for(let ch of raw){if(mapNum[ch])nums+=mapNum[ch];}nums=nums.slice(0,3).padStart(3,'0');let letters=raw.slice(0,3).padEnd(3,raw[0]||'A');const sugg=[{num:nums,let:letters,desc:`${raw} → цифры похожи`},{num:'707',let:letters,desc:`707 + ${raw}`},{num:'777',let:letters,desc:`777 + ${raw}`}];const box=document.getElementById('nameResults');box.innerHTML=sugg.map(s=>{const cat=getCategory(s.num,s.let[0]===s.let[1]&&s.let[1]===s.let[2]);const price=cat.mrp*MRP;return `<div class="name-result"><b>${s.num} ${s.let} - ${s.desc}</b><br><span style="color:#2a5db0;font-weight:800">${price.toLocaleString('ru-RU')} ₸ • ${cat.mrp} МРП</span> <button onclick="applySug('${s.num}','${s.let}')" style="margin-left:8px;padding:4px 8px;border-radius:6px;border:1px solid #2a5db0;background:#fff;color:#2a5db0;font-weight:700;cursor:pointer">Выбрать</button></div>`;}).join('');}function applySug(num,lettrs){document.getElementById('digits').value=num;document.getElementById('letters').value=lettrs;render();}document.getElementById('digits').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,3);updateResult();});document.getElementById('letters').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);updateResult();});document.getElementById('region').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,2);updateResult();});document.getElementById('nameInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,12);});initFilters();render();
