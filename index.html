<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP номера - Проверка занятости</title>
<style>
*{box-sizing:border-box;font-family:Inter,-apple-system,sans-serif}
body{margin:0;background:#f4f6f9;color:#1a1a1a}
.egov-header{background:#fff;border-bottom:1px solid #e5e8eb;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.egov-logo{width:32px;height:32px;background:#2a5db0;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.container{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px;border:1px solid #eef1f4}
label{font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
select,input{width:100%;padding:12px 14px;border:1.5px solid #dfe3e8;border-radius:8px;font-size:16px;font-weight:700;margin-top:6px;text-transform:uppercase}
.btn{width:100%;background:#2a5db0;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:800;font-size:15px;margin-top:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}
.num-card{border:1.5px solid #e5e8eb;border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:#fff;position:relative;overflow:hidden}
.num-card.busy{opacity:.6;border-color:#fecaca;background:#fef2f2}
.num-card.free{border-color:#bbf7d0;background:#f0fdf4}
.num-card b{font-size:18px;display:block}
.status{font-size:10px;font-weight:800;padding:2px 6px;border-radius:10px;margin-top:4px;display:inline-block}
.status.free{color:#16a34a;background:#dcfce7}
.status.busy{color:#dc2626;background:#fee2e2}
.price-tag{font-weight:800;color:#2a5db0;margin-top:4px;font-size:14px}
.filter-bar{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-top:8px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;background:#eef2f7;font-size:13px;font-weight:700;border:1px solid #dfe3e8;cursor:pointer}
.chip.active{background:#2a5db0;color:#fff;border-color:#2a5db0}
.small{font-size:11px;color:#888;line-height:1.4;margin-top:12px}
.plate-wrap{display:flex;justify-content:center;padding:30px 0 20px}
.plate{display:flex;align-items:center;border:2px solid #cbd5e1;border-radius:12px;background:#fff;overflow:hidden;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.plate-kz{width:52px;height:100%;background:#f8fafc;border-right:2px solid #cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;line-height:1}
.plate-main{padding:0 14px;display:flex;gap:6px;align-items:center}
.plate-main input{border:none;padding:0;margin:0;width:110px;font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;background:transparent}
.plate-reg{border-left:2px solid #cbd5e1;height:100%;display:flex;align-items:center;padding:0 14px}
.plate-reg input{border:none;padding:0;margin:0;width:40px;font-size:24px;font-weight:800;text-align:center;background:transparent}
.result-box{border-radius:12px;padding:14px;margin-top:16px;border:1px solid #eef1f4}
.result-box.free{background:#f0fdf4;border-color:#bbf7d0}
.result-box.busy{background:#fef2f2;border-color:#fecaca}
.name-result{border:1px dashed #2a5db0;background:#f0f5ff;border-radius:10px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div class="egov-header"><div class="egov-logo">KZ</div><div><div style="font-weight:700;font-size:15px">VIP номера Казахстана</div><div style="font-size:12px;color:#6b7280">Заказ номерного знака для авто</div></div></div>

<div class="container">

<div class="card" style="border:2px solid #2a5db0">
<label style="color:#2a5db0">✨ ПОДБОР ПО ИМЕНИ - только английскими буквами</label>
<div style="display:flex;gap:8px;margin-top:6px"><input id="nameInput" placeholder="DIAS" maxlength="12" style="text-transform:uppercase;flex:2"><button class="btn" style="margin:0;flex:1" onclick="findByName()">Найти</button></div>
<div id="nameResults"></div>
</div>

<div class="card">
<label style="text-align:center;display:block">Нажми на номер, буквы или регион</label>
<div class="plate-wrap">
<div class="plate">
<div class="plate-kz"><i>🇰🇿</i>KZ</div>
<div class="plate-main"><input id="digits" value="777" maxlength="3" inputmode="numeric"><input id="letters" value="OOE" maxlength="3" style="width:80px"></div>
<div class="plate-reg"><input id="region" value="05" maxlength="2" inputmode="numeric"></div>
</div>
</div>

<div class="result-box free" id="resultBox">
<div style="font-size:13px" id="resultFreeText">Уважаемый Пользователь, выбранный Вами ГРНЗ свободен</div>
<div style="font-size:12px;color:#666;margin-top:4px" id="resultCat">Стоимость составляет 228 МРП</div>
<div style="font-size:22px;font-weight:900;margin-top:6px" id="resultPrice">986100 тенге</div>
<div style="font-size:11px;margin-top:6px" id="resultBusyHint"></div>
</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><label>Фильтр</label><div style="font-size:11px"><span style="color:#16a34a">●</span> свободен <span style="color:#dc2626;margin-left:8px">●</span> занят</div></div>
<div class="filter-bar" id="filterBar"></div>
<div class="filter-bar"><div class="chip active" onclick="setFreeFilter('all',this)">Все</div><div class="chip" onclick="setFreeFilter('free',this)">Только свободные</div><div class="chip" onclick="setFreeFilter('busy',this)">Только занятые</div></div>
<div class="grid" id="grid"></div>
</div>

</div>

<script>
const MRP=4325;
const CAT_010 = ["010","020","030","040","050","060","070","077","080","090","707"];
const CAT_100 = ["100","111","200","222","300","333","400","444","500","555","600","666","700","800","888","900","999"];
const CAT_001 = ["001","002","003","004","005","006","007","008","009","777"];
const CAT_MIRROR = ["101","121","131","141","151","161","171","181","191","202","212","232","242","252","262","272","282","292","303","313","323","343","353","363","373","383","393","404","414","424","434","454","464","474","484","494","505","515","525","535","545","565","575","585","595","606","616","626","636","646","656","676","686","696","717","727","737","747","757","767","787","797","808","818","828","838","848","858","868","878","898","909","919","929","939","949","959","969","979","989"];

let currentFilter='all';
let freeFilter='all';
const filters = [{id:'all',label:'Все'},{id:'10',label:'10 МРП'},{id:'15',label:'15 МРП'},{id:'57',label:'57 МРП'},{id:'72',label:'72 МРП'},{id:'114',label:'114 МРП'},{id:'137',label:'137 МРП'},{id:'194',label:'194 МРП'},{id:'228',label:'228 МРП'},{id:'285',label:'285 МРП'}];

function initFilters(){
  document.getElementById('filterBar').innerHTML=filters.map(f=>`<div class="chip ${f.id==='all'?'active':''}" onclick="setFilter('${f.id}',this)">${f.label}</div>`).join('');
}
function setFilter(f,el){currentFilter=f;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render();}
function setFreeFilter(f,el){freeFilter=f;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render();}

function getCategory(num, same){
  if(CAT_001.includes(num)) return {mrp:285};
  if(CAT_100.includes(num)) return {mrp: same?194:137};
  if(CAT_010.includes(num)) return {mrp: same?114:57};
  if(CAT_MIRROR.includes(num)) return {mrp: same?72:15};
  if(same) return {mrp:57};
  return {mrp:10};
}

// === ЛОГИКА ЗАНЯТОСТИ - КАК В РЕАЛЬНОМ СПЕЦЦОНЕ ===
function isFreeNumber(num, letters, region){
  const key = `${num}${letters}${region}`;
  let hash=0; for(let i=0;i<key.length;i++){ hash = (hash*31 + key.charCodeAt(i)) % 100; }
  // Топовые почти всегда заняты
  if(CAT_001.includes(num) && letters[0]===letters[1] && letters[1]===letters[2]) return hash > 85; // 85% заняты, 15% свободны
  if(CAT_001.includes(num)) return hash > 60; // 60% заняты
  if(CAT_100.includes(num) && letters[0]===letters[1]) return hash > 50;
  if(num==='777' || num==='007' || num==='001') return hash > 70;
  // Обычные чаще свободны
  return hash > 30; // 70% свободны, 30% заняты
}

function updateResult(){
  let d=(document.getElementById('digits').value||'').replace(/\D/g,'').slice(0,3).padStart(3,'0');
  let l=(document.getElementById('letters').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3).padEnd(3,'A');
  let r=(document.getElementById('region').value||'').replace(/\D/g,'').slice(0,2).padStart(2,'0');
  const same = l[0]===l[1] && l[1]===l[2];
  const cat=getCategory(d, same);
  const price=cat.mrp*MRP;
  const free=isFreeNumber(d,l,r);
  const box=document.getElementById('resultBox');
  box.className='result-box '+(free?'free':'busy');
  document.getElementById('resultFreeText').innerHTML = free ? `Уважаемый Пользователь, выбранный Вами ГРНЗ <b>${d} ${l} ${r}</b> свободен` : `Уважаемый Пользователь, выбранный Вами ГРНЗ <b>${d} ${l} ${r}</b> занят`;
  document.getElementById('resultFreeText').style.color= free ? '#16a34a' : '#dc2626';
  document.getElementById('resultCat').innerText=`Стоимость составляет ${cat.mrp} МРП`;
  document.getElementById('resultPrice').innerText=`${price.toLocaleString('ru-RU')} тенге`;
  document.getElementById('resultBusyHint').innerText= free ? 'Можно продолжить оформление' : 'Попробуйте другой регион или буквы - в другом регионе может быть свободен';
}

function render(){
  let d=(document.getElementById('digits').value||'').replace(/\D/g,'').slice(0,3);
  let l=(document.getElementById('letters').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
  let r=(document.getElementById('region').value||'').replace(/\D/g,'').slice(0,2);
  document.getElementById('digits').value=d;
  document.getElementById('letters').value=l;
  document.getElementById('region').value=r;
  if(d.length!==3 || l.length!==3 || r.length!==2){ updateResult(); return; }
  const region=r;
  const grid=document.getElementById('grid');grid.innerHTML='';
  let baseNums = [...CAT_001, ...CAT_100, ...CAT_010, ...CAT_MIRROR, "707","777","010","101","202","303","404","505","606","808","909","123","321","811"];
  baseNums = [...new Set(baseNums)];
  let list=[];
  baseNums.forEach(n=>{
    const cat=getCategory(n, l[0]===l[1] && l[1]===l[2]);
    if(currentFilter!=='all' && String(cat.mrp)!==currentFilter) return;
    const free=isFreeNumber(n,l,region);
    if(freeFilter==='free' && !free) return;
    if(freeFilter==='busy' && free) return;
    list.push({num:n, letters:l, same:l[0]===l[1]&&l[1]===l[2], cat, free});
  });
  list.sort((a,b)=> (b.free - a.free) || (b.cat.mrp - a.cat.mrp));
  list.forEach(item=>{
    const price=item.cat.mrp*MRP;
    const div=document.createElement('div');div.className='num-card '+(item.free?'free':'busy');
    div.innerHTML=`<b>${item.num} ${item.letters}</b><span>${region}</span><div class="price-tag">${price.toLocaleString('ru-RU')} ₸</div><span>${item.cat.mrp} МРП</span><br><span class="status ${item.free?'free':'busy'}">${item.free?'СВОБОДЕН':'ЗАНЯТ'}</span>`;
    div.onclick=()=>{document.getElementById('digits').value=item.num; updateResult(); render(); window.scrollTo({top:0,behavior:'smooth'})};
    grid.appendChild(div);
  });
  updateResult();
}

function findByName(){
  let raw=(document.getElementById('nameInput').value||'').toUpperCase().trim().replace(/[^A-Z]/g,'').slice(0,12);
  document.getElementById('nameInput').value=raw;
  if(!raw || raw.length<2){alert('Напиши имя на английском, например DIAS');return;}
  const mapNum={'A':'4','O':'0','S':'5','E':'3','I':'1','Z':'2','B':'8','D':'0','L':'1','G':'6','Q':'9'};
  let nums=''; for(let ch of raw){ if(mapNum[ch]) nums+=mapNum[ch]; }
  nums=nums.slice(0,3).padStart(3,'0');
  let letters=raw.slice(0,3).padEnd(3, raw[0]||'A');
  const sugg=[{num:nums, let:letters, desc:`${raw} → цифры похожи`},{num:'707', let:letters, desc:`707 + ${raw}`},{num:'777', let:letters, desc:`777 + ${raw}`}];
  const box=document.getElementById('nameResults');
  box.innerHTML=sugg.map(s=>{
    const cat=getCategory(s.num, s.let[0]===s.let[1]&&s.let[1]===s.let[2]);
    const price=cat.mrp*MRP;
    const free=isFreeNumber(s.num,s.let,document.getElementById('region').value||'05');
    return `<div class="name-result"><b>${s.num} ${s.let} - ${s.desc}</b> <span class="status ${free?'free':'busy'}" style="margin-left:6px">${free?'СВОБОДЕН':'ЗАНЯТ'}</span><br><span style="color:#2a5db0;font-weight:800">${price.toLocaleString('ru-RU')} ₸ • ${cat.mrp} МРП</span> <button onclick="applySug('${s.num}','${s.let}')" style="margin-left:8px;padding:4px 8px;border-radius:6px;border:1px solid #2a5db0;background:#fff;color:#2a5db0;font-weight:700;cursor:pointer">Выбрать</button></div>`;
  }).join('');
}
function applySug(num, lettrs){document.getElementById('digits').value=num; document.getElementById('letters').value=lettrs; render();}

document.getElementById('digits').addEventListener('input', e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,3); render();});
document.getElementById('letters').addEventListener('input', e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3); render();});
document.getElementById('region').addEventListener('input', e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,2); render();});
document.getElementById('nameInput').addEventListener('input', e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,12);});

initFilters();
render();
</script>
</body>
</html>
