<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Погода">
<title>Погода</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #1c2b4a, #3a6ea5);
    color: #fff;
  }
  .widget {
    width: 170px;
    height: 170px;
    border-radius: 24px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
  }
  .city { font-size: 14px; opacity: 0.85; }
  .icon { font-size: 44px; line-height: 1; }
  .temp { font-size: 40px; font-weight: 600; }
  .desc { font-size: 13px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="widget">
    <div class="city" id="city">Загрузка...</div>
    <div class="icon" id="icon">⏳</div>
    <div class="temp" id="temp">--°</div>
    <div class="desc" id="desc"></div>
  </div>

<script>
  const DEFAULT = { lat: 56.84, lon: 60.61, name: "Екатеринбург" };

  function describe(code) {
    if (code === 0) return ["☀️", "Ясно"];
    if (code <= 2) return ["🌤️", "Малооблачно"];
    if (code === 3) return ["☁️", "Облачно"];
    if (code === 45 || code === 48) return ["🌫️", "Туман"];
    if (code >= 51 && code <= 57) return ["🌦️", "Морось"];
    if (code >= 61 && code <= 67) return ["🌧️", "Дождь"];
    if (code >= 71 && code <= 77) return ["❄️", "Снег"];
    if (code >= 80 && code <= 82) return ["🌧️", "Ливень"];
    if (code >= 95) return ["⛈️", "Гроза"];
    return ["🌡️", "Погода"];
  }

  async function cityName(lat, lon) {
    try {
      const r = await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`
      );
      const j = await r.json();
      return j.city || j.locality || "Ваш город";
    } catch (e) {
      return "Ваш город";
    }
  }

  async function showWeather(lat, lon, name) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`;
      const r = await fetch(url);
      const j = await r.json();
      const t = Math.round(j.current.temperature_2m);
      const [icon, text] = describe(j.current.weather_code);
      document.getElementById("city").textContent = name;
      document.getElementById("icon").textContent = icon;
      document.getElementById("temp").textContent = t + "°";
      document.getElementById("desc").textContent = text;
    } catch (e) {
      document.getElementById("city").textContent = "Нет связи";
      document.getElementById("icon").textContent = "⚠️";
    }
  }

  function start() {
    if (!navigator.geolocation) {
      showWeather(DEFAULT.lat, DEFAULT.lon, DEFAULT.name);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        const name = await cityName(latitude, longitude);
        showWeather(latitude, longitude, name);
      },
      () => showWeather(DEFAULT.lat, DEFAULT.lon, DEFAULT.name),
      { timeout: 8000 }
    );
  }

  start();
  setInterval(start, 30 * 60 * 1000);
</script>
</body>
</html>
